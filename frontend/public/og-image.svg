<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c0f"/>
      <stop offset="100%" stop-color="#080c0f"/>
    </linearGradient>

    <!-- Teal glow top-center -->
    <radialGradient id="glow1" cx="50%" cy="0%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0b9eb3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b9eb3" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple glow bottom-right -->
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1040 710) scale(380)">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo square glow -->
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="52" height="52" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="white" fill-opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="#0b9eb3" opacity="0.85"/>

  <!--
    Layout (mirrors Python script):
      ROW  (logo + wordmark): vertically centered block, top at yâ‰ˆ191
      logo bounding box: 115Ã—115 â†’ starts xâ‰ˆ285, yâ‰ˆ191
      wordmark: xâ‰ˆ424, yâ‰ˆ216 (vertically centred in 115px)
      tagline: centred at x=600, yâ‰ˆ350
      pills:   centred starting xâ‰ˆ213, yâ‰ˆ418
  -->

  <!-- â”€â”€ Logo mark â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
  <g filter="url(#logoGlow)">
    <!-- outlined square (source) -->
    <rect x="285" y="191" width="65" height="65" rx="17"
          stroke="#0b9eb3" stroke-width="8" fill="none"/>
    <!-- filled square (output) -->
    <rect x="335" y="241" width="65" height="65" rx="17"
          fill="#0b9eb3"/>
  </g>

